(()=>{'use strict';const $=s=>document.querySelector(s),views=[...document.querySelectorAll('.view')],arena=$('#arena'),answers=$('#answers'),feedback=$('#feedback'),shuffle=a=>[...a].sort(()=>Math.random()-.5),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const titles={complete:'✍️ Sambung Peribahasa',meaning:'💡 Cari Maksud',picture:'🖼️ Teka Bergambar',arrange:'🧩 Susun Peribahasa',boss:'👑 Boss Challenge'};let year=1,game='',score=0,lives=3,time=90,round=1,correct=0,locked=false,tick,pool=[],current,selected=[];let high=0;$('#high').textContent=high;function show(id){views.forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}function update(){$('#score').textContent=score;$('#lives').textContent=lives;$('#time').textContent=time;$('#round').textContent=Math.min(round,10);$('#fill').style.width=(time/90*100)+'%';if(score>high){high=score;$('#high').textContent=high}}function tone(f,d=.14,delay=0){try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}function stars(){for(let i=0;i<12;i++){let s=document.createElement('span');s.className='burst';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='55%';let a=Math.PI*2*i/12,d=rand(70,180);s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}function choices(field,good){let o=[good];while(o.length<4){let x=banks[year][rand(0,29)][field];if(!o.includes(x))o.push(x)}return shuffle(o)}function buttons(list,ans){answers.innerHTML='';list.forEach(x=>{let b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>pick(x,ans,b);answers.appendChild(b)})}function pick(x,ans,b){if(locked)return;if(x===ans){locked=true;score+=10;correct++;feedback.textContent='Betul! Hebat! 🎉';feedback.className='feedback good';b.style.background='#70dfa8';tone(530);tone(710,.18,.14);stars();update();setTimeout(next,850)}else{lives--;feedback.textContent='Belum tepat. Cuba lagi!';feedback.className='feedback bad';tone(230,.2);update();if(lives<=0)setTimeout(end,400)}}function start(g){game=g;score=0;lives=3;time=90;round=1;correct=0;locked=false;pool=shuffle(banks[year]);$('#title').textContent=titles[g];feedback.textContent='';show('#play');clearInterval(tick);tick=setInterval(()=>{time--;update();if(time<=0)end()},1000);update();question()}function next(){if(lives<=0||time<=0)return end();if(++round>10)return end();locked=false;feedback.textContent='';question()}function question(){current=pool.shift();let type=game==='boss'?shuffle(['complete','meaning','picture','arrange'])[0]:game;answers.innerHTML='';if(type==='complete'){arena.innerHTML=`<div><p class="prompt">Lengkapkan ungkapan:</p><div class="proverb">${current.prefix} <span class="blank">_____</span></div></div>`;buttons(choices('last',current.last),current.last)}else if(type==='meaning'){arena.innerHTML=`<div><p class="prompt">Apakah maksudnya?</p><div class="proverb">“${current.p}”</div></div>`;buttons(choices('m',current.m),current.m)}else if(type==='picture'){arena.innerHTML=`<div><p class="prompt">Teka berdasarkan gambar:</p><div class="picture">${current.pic}</div></div>`;buttons(choices('p',current.p),current.p)}else arrange()}function arrange(){selected=[];let words=shuffle(current.p.split(' '));arena.innerHTML='<div style="width:100%"><p class="prompt">Susun perkataan dengan betul:</p><div id="built" class="built"></div><div id="bank" class="bank"></div><button id="check" class="primary">Semak</button></div>';words.forEach((w,i)=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.dataset.id=i;b.onclick=()=>{if(b.hidden)return;b.hidden=true;selected.push({w,id:i});draw()};$('#bank').appendChild(b)});$('#check').onclick=()=>{if(selected.map(x=>x.w).join(' ')===current.p)pick(current.p,current.p,$('#check'));else{lives--;feedback.textContent='Susunan belum betul. Cuba semula!';feedback.className='feedback bad';selected=[];[...$('#bank').children].forEach(x=>x.hidden=false);draw();update();if(lives<=0)setTimeout(end,400)}}}function draw(){let box=$('#built');box.innerHTML='';selected.forEach((o,i)=>{let b=document.createElement('button');b.className='word';b.textContent=o.w;b.onclick=()=>{selected.splice(i,1);let src=[...$('#bank').children].find(x=>+x.dataset.id===o.id);if(src)src.hidden=false;draw()};box.appendChild(b)})}function end(){clearInterval(tick);locked=true;$('#medal').textContent=score>=80?'🥇':score>=50?'🥈':'🥉';$('#resultTitle').textContent=lives<=0?'Jangan putus asa!':'Tahniah!';$('#resultText').innerHTML=`Tahun ${year}<br>Skor: <b>${score}</b><br>Betul: <b>${correct}</b>/10<br>High score: <b>${high}</b>`;show('#result');update()}document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=+b.dataset.year;$('#yearTitle').textContent='Tahun '+year;show('#menu')});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#change').onclick=()=>show('#years');$('#back').onclick=()=>{clearInterval(tick);show('#menu')};$('#home').onclick=()=>show('#menu');$('#again').onclick=()=>start(game);update()})();
</script></body></html>
